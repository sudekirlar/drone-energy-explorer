[project]
name = "drone-energy-explorer"
version = "0.1.0"
description = "CEN445 Data Visualization: interactive dashboard on delivery-drone energy use (CMU dataset)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_issues.py" = ["E501"]  # long task descriptions in a data table

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
